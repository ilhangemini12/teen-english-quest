name: JS Syntax Check
on:
  push:
    branches: [main, vnext-v5.4-refactor, vnext-v5.5-desktop, vnext-v5.6-voice, vnext-v5.7-focus, vnext-v5.8-focus-moods, vnext-v5.9-mobile-minimal]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract inline app script
        run: |
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          scripts=[x for x in scripts if x.strip()]
          scripts.sort(key=len, reverse=True)
          open('/tmp/app.js','w',encoding='utf-8').write(scripts[0])
          print('lines', scripts[0].count('\n')+1, 'bytes', len(scripts[0]))
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
