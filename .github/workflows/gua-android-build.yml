name: GUA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'gua-android/**'
      - '.github/workflows/gua-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: gua-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp gua-android/app/build/outputs/apk/debug/app-debug.apk GUA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GUA-Android-APK
          path: GUA-debug.apk
          if-no-files-found: error
