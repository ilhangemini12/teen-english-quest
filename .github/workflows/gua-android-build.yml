name: GUA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'gua-android/**'
      - '.github/workflows/gua-android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GUA_KEYSTORE_PASSWORD: ${{ secrets.GUA_KEYSTORE_PASSWORD }}
      GUA_KEY_ALIAS: ${{ secrets.GUA_KEY_ALIAS }}
      GUA_KEY_PASSWORD: ${{ secrets.GUA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore encrypted GUA signing key
        shell: bash
        run: |
          DEST="$RUNNER_TEMP/gua-release.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in gua-android/signing/gua-release.jks.enc \
            -out "$DEST" \
            -pass env:GUA_KEYSTORE_PASSWORD
          test -s "$DEST"
          echo "JKS sha256: $(sha256sum "$DEST" | cut -d' ' -f1)"
          keytool -list -keystore "$DEST" -storetype JKS -storepass "$GUA_KEYSTORE_PASSWORD" -alias "$GUA_KEY_ALIAS"
          echo "GUA_KEYSTORE_FILE=$DEST" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        working-directory: gua-android
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release file
        shell: bash
        run: |
          VERSION="$(grep -oP 'versionName "\K[^"]+' gua-android/app/build.gradle)"
          echo "GUA_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp gua-android/app/build/outputs/apk/release/app-release.apk "GUA-v$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "GUA-v$VERSION.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUA-Android-APK
          path: GUA-v${{ env.GUA_VERSION }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="gua-v$GUA_VERSION"
          APK="GUA-v$GUA_VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "GUA v$GUA_VERSION" --notes "Signed personal Android release for GUA Spanish Academy." --latest
          fi
