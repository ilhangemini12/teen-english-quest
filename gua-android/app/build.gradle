plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gua.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.ilhan.gua"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv("GUA_KEYSTORE_FILE")
            if (ks != null && !ks.isBlank()) {
                storeFile file(ks)
                storePassword System.getenv("GUA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GUA_KEY_ALIAS")
                keyPassword System.getenv("GUA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
